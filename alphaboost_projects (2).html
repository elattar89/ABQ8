<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AlphaBoost Kuwait</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>

*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:#020408;font-family:'Tajawal',sans-serif;direction:rtl;overflow-x:hidden;position:relative;}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(33,150,243,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(33,150,243,0.05) 1px,transparent 1px);background-size:40px 40px;animation:gridPulse 4s ease-in-out infinite;z-index:0;}
@keyframes gridPulse{0%,100%{opacity:.5;}50%{opacity:1;}}
.beam{position:fixed;top:0;animation:beamFade 2.5s ease-in-out infinite;z-index:1;}
.beam-main{left:50%;transform:translateX(-50%);width:2px;height:300px;background:linear-gradient(180deg,transparent,#2196F3,transparent);opacity:.6;}
.beam-red{left:35%;width:1px;height:200px;background:linear-gradient(180deg,transparent,#e53935,transparent);opacity:.4;animation-duration:3.5s;animation-delay:.7s;}
.beam-right{left:65%;width:1px;height:150px;background:linear-gradient(180deg,transparent,#2196F3,transparent);opacity:.3;animation-duration:4s;animation-delay:1.2s;}
@keyframes beamFade{0%,100%{opacity:.2;}50%{opacity:.7;}}
.hex-ring{position:fixed;border-radius:50%;border:1px solid rgba(33,150,243,0.1);animation:ringPulse ease-in-out infinite;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;}
@keyframes ringPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.1;}50%{transform:translate(-50%,-50%) scale(1.04);opacity:.22;}}
#particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.particle{position:absolute;border-radius:50%;animation:particleFloat linear infinite;}
@keyframes particleFloat{0%{transform:translateY(0) translateX(0) scale(1);opacity:0;}15%{opacity:1;}85%{opacity:.7;}100%{transform:translateY(-100vh) translateX(var(--dx,30px)) scale(.2);opacity:0;}}
@keyframes logoGlitch{0%,100%{transform:translate(0,0);filter:brightness(1);}92%{transform:translate(0,0);filter:brightness(1);}93%{transform:translate(-1px,0);filter:brightness(1.05) hue-rotate(5deg);}94%{transform:translate(1px,0);filter:brightness(0.98);}95%{transform:translate(0,0);filter:brightness(1);}}
@keyframes floatUp{0%{bottom:-10px;opacity:0;}20%{opacity:1;}100%{bottom:160px;opacity:0;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
/* LOGIN */
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.ab-card{position:relative;z-index:10;width:380px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:36px 32px 28px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:slideUp .5s ease;}
.card-glow-top{position:absolute;top:0;left:50%;transform:translateX(-50%);width:240px;height:1px;background:linear-gradient(90deg,transparent,#2196F3 40%,#e53935 60%,transparent);}
.corner-accent{position:absolute;width:55px;height:55px;border-style:solid;}
.ca-tl{top:-1px;right:-1px;border-color:rgba(33,150,243,0.35);border-width:2px 2px 0 0;border-radius:0 8px 0 0;}
.ca-br{bottom:-1px;left:-1px;border-color:rgba(33,150,243,0.35);border-width:0 0 2px 2px;border-radius:0 0 8px 0;}
.ca-tr{top:-1px;left:-1px;border-color:rgba(229,57,53,0.3);border-width:2px 0 0 2px;border-radius:8px 0 0 0;}
.ca-bl{bottom:-1px;right:-1px;border-color:rgba(229,57,53,0.3);border-width:0 2px 2px 0;border-radius:0 0 0 8px;}
.logo-wrap{text-align:center;margin-bottom:22px;}
.logo-canvas{width:180px;height:180px;margin:0 auto 14px;position:relative;display:inline-block;}
.logo-ring{position:absolute;border-radius:50%;border:1px solid rgba(33,150,243,0.25);animation:ringPulse 2.5s ease-in-out infinite;top:50%;left:50%;transform:translate(-50%,-50%);}
.logo-ring2{border-color:rgba(229,57,53,0.15);animation-duration:3.2s;animation-delay:.5s;}
.logo-img-box{width:180px;height:180px;border-radius:28px;overflow:hidden;background:#080d16;border:1px solid rgba(33,150,243,0.28);display:flex;align-items:center;justify-content:center;}
.logo-img-box img{width:100%;height:100%;object-fit:cover;}
.brand-name{color:#fff;font-size:22px;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-family:'Rajdhani',sans-serif;}
.brand-name span{color:#2196F3;}
.brand-sub{color:rgba(255,255,255,0.3);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-top:4px;font-family:'Rajdhani',sans-serif;}
.divider{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1));}
.divider::after{background:linear-gradient(90deg,rgba(255,255,255,0.1),transparent);}
.divider span{color:rgba(255,255,255,0.2);font-size:10px;letter-spacing:2px;white-space:nowrap;}
.field-wrap{position:relative;margin-bottom:13px;}
.field-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:17px;color:rgba(255,255,255,0.28);transition:color .2s;pointer-events:none;}
.ab-field{width:100%;padding:13px 46px 13px 14px;border-radius:11px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff;font-size:14px;font-family:'Tajawal',sans-serif;outline:none;transition:border-color .2s,background .2s;text-align:right;direction:rtl;}
.ab-field::placeholder{color:rgba(255,255,255,0.22);}
.ab-field:focus{border-color:rgba(33,150,243,0.5);background:rgba(33,150,243,0.06);box-shadow:0 0 0 3px rgba(33,150,243,0.08);}
.field-wrap:focus-within .field-icon{color:#2196F3;}
.show-pass-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;cursor:pointer;user-select:none;}
.show-pass-row input[type=checkbox]{display:none;}
.custom-cb{width:18px;height:18px;flex-shrink:0;border-radius:5px;border:1.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;transition:border-color .2s,background .2s;}
.show-pass-row input[type=checkbox]:checked + .custom-cb{border-color:#2196F3;background:rgba(33,150,243,0.2);}
.cb-check{font-size:12px;color:#2196F3;display:none;}
.show-pass-row input[type=checkbox]:checked + .custom-cb .cb-check{display:block;}
.cb-label{color:rgba(255,255,255,0.4);font-size:13px;}
.btn-login{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#1565c0,#1e88e5,#1565c0);background-size:200%;color:#fff;font-size:16px;font-weight:900;cursor:pointer;font-family:'Tajawal',sans-serif;position:relative;overflow:hidden;transition:background-position .4s,transform .1s;letter-spacing:.5px;}
.btn-login:hover{background-position:right;}
.btn-login:active{transform:scale(.98);}
.status-row{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:18px;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#4caf50;animation:blink 2s ease-in-out infinite;box-shadow:0 0 6px #4caf50;}
.status-text{color:rgba(255,255,255,0.18);font-size:10px;letter-spacing:2px;font-family:'Rajdhani',sans-serif;}
.login-err{display:none;color:#f87171;font-size:13px;text-align:center;margin-bottom:10px;padding:8px;background:rgba(220,38,38,0.1);border-radius:8px;border:1px solid rgba(220,38,38,0.2);}
/* PROJECTS */
#projectsPage{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px 80px;}
.page-header{position:relative;z-index:10;text-align:center;margin-bottom:36px;animation:slideUp .5s ease;}
.ab-logo-top{width:76px;height:76px;border-radius:16px;overflow:hidden;background:#080d16;border:1px solid rgba(33,150,243,0.28);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 0 22px rgba(33,150,243,0.15);}
.ab-logo-top img{width:100%;height:100%;object-fit:cover;}
.page-title{color:#fff;font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-family:'Rajdhani',sans-serif;}
.page-title span{color:#2196F3;}
.page-sub{color:rgba(255,255,255,0.3);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-top:5px;font-family:'Rajdhani',sans-serif;}
.projects-grid{position:relative;z-index:10;display:flex;flex-wrap:wrap;gap:22px;justify-content:center;max-width:960px;}
.proj-card{width:240px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:26px 18px 20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:pointer;text-align:center;transition:transform .25s,border-color .25s,box-shadow .25s;position:relative;overflow:hidden;animation:slideUp .5s ease;}
.proj-card:hover{transform:translateY(-6px);border-color:rgba(33,150,243,0.4);box-shadow:0 0 30px rgba(33,150,243,0.12),0 12px 40px rgba(0,0,0,0.4);}
.proj-card-glow{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:1px;background:linear-gradient(90deg,transparent,#2196F3 40%,#e53935 60%,transparent);}
.proj-corner{position:absolute;width:38px;height:38px;border-style:solid;}
.pc-tl{top:-1px;right:-1px;border-color:rgba(33,150,243,0.35);border-width:2px 2px 0 0;border-radius:0 8px 0 0;}
.pc-br{bottom:-1px;left:-1px;border-color:rgba(33,150,243,0.35);border-width:0 0 2px 2px;border-radius:0 0 8px 0;}
.pc-tr{top:-1px;left:-1px;border-color:rgba(229,57,53,0.3);border-width:2px 0 0 2px;border-radius:8px 0 0 0;}
.pc-bl{bottom:-1px;right:-1px;border-color:rgba(229,57,53,0.3);border-width:0 2px 2px 0;border-radius:0 0 0 8px;}
.proj-logo-wrap{position:relative;width:120px;height:120px;margin:0 auto 14px;display:inline-block;}
.proj-logo-ring{position:absolute;border-radius:50%;border:1px solid rgba(33,150,243,0.25);animation:ringPulse 2.5s ease-in-out infinite;top:50%;left:50%;transform:translate(-50%,-50%);}
.proj-logo-ring2{border-color:rgba(229,57,53,0.15);animation-duration:3.2s;animation-delay:.5s;}
.proj-logo-box{width:120px;height:120px;border-radius:18px;overflow:hidden;background:#080d16;border:1px solid rgba(33,150,243,0.28);display:flex;align-items:center;justify-content:center;animation:logoGlitch 1.6s infinite;}
.proj-logo-box img{width:100%;height:100%;object-fit:contain;}
.proj-bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,0.3);bottom:-10px;animation:floatUp linear infinite;pointer-events:none;}
.proj-name{color:#fff;font-size:17px;font-weight:700;letter-spacing:1px;font-family:'Rajdhani',sans-serif;margin-bottom:5px;}
.proj-desc{color:rgba(255,255,255,0.35);font-size:12px;line-height:1.5;margin-bottom:13px;}
.proj-btn{display:inline-block;padding:8px 20px;border-radius:10px;border:none;background:linear-gradient(135deg,#1565c0,#1e88e5);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif;transition:opacity .2s,transform .1s;}
.proj-btn:hover{opacity:.85;}
.proj-btn:active{transform:scale(.97);}

.add-card{width:240px;background:rgba(33,150,243,0.03);border:2px dashed rgba(33,150,243,0.2);border-radius:22px;padding:26px 18px;cursor:pointer;text-align:center;transition:transform .25s,border-color .25s,background .25s;position:relative;z-index:10;animation:slideUp .5s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;}
.add-card:hover{transform:translateY(-6px);border-color:rgba(33,150,243,0.5);background:rgba(33,150,243,0.06);}
.add-icon{width:70px;height:70px;border-radius:50%;background:rgba(33,150,243,0.1);border:1px solid rgba(33,150,243,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:32px;color:rgba(33,150,243,0.7);}
.add-card:hover .add-icon{background:rgba(33,150,243,0.18);}
.add-label{color:rgba(255,255,255,0.4);font-size:14px;font-family:'Rajdhani',sans-serif;letter-spacing:1px;}
/* FOOTER */
.page-footer{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:12px 20px;background:rgba(2,4,8,0.9);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,0.06);display:none;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}
.footer-btn{padding:9px 20px;border-radius:10px;font-size:13px;font-weight:700;font-family:'Tajawal',sans-serif;cursor:pointer;transition:opacity .2s,transform .1s;}
.footer-btn:active{transform:scale(.97);}
.btn-accounts{border:1px solid rgba(124,58,237,0.4);background:rgba(59,7,100,0.5);color:#c4b5fd;}
.btn-accounts:hover{background:rgba(124,58,237,0.25);}
.btn-logout{border:1px solid rgba(239,68,68,0.4);background:rgba(239,68,68,0.08);color:#fca5a5;}
.btn-logout:hover{background:rgba(239,68,68,0.18);}
.btn-projects{border:1px solid rgba(33,150,243,0.4);background:rgba(33,150,243,0.08);color:#93c5fd;}
.btn-projects:hover{background:rgba(33,150,243,0.2);}
.footer-status{display:flex;align-items:center;gap:6px;margin-right:auto;}
.f-dot{width:7px;height:7px;border-radius:50%;background:#4caf50;animation:blink 2s ease-in-out infinite;box-shadow:0 0 6px #4caf50;}
.f-txt{color:rgba(255,255,255,0.18);font-size:10px;letter-spacing:2px;font-family:'Rajdhani',sans-serif;}
/* MODALS */
.modal-overlay{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;padding:1rem;font-family:'Tajawal',sans-serif;direction:rtl;animation:fadeIn .2s ease;}
.modal-box{background:#0d1117;border:1px solid #30363d;border-radius:18px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;padding:1.5rem;}
.modal-title{color:#e6edf3;font-size:18px;font-weight:900;margin-bottom:1.2rem;display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:#21262d;border:1px solid #30363d;color:#8b949e;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;}
.modal-field{margin-bottom:.9rem;}
.modal-field label{display:block;color:#8b949e;font-size:12px;margin-bottom:5px;}
.modal-input{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-family:'Tajawal',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.modal-input:focus{border-color:#2196F3;}
.modal-actions{display:flex;gap:8px;margin-top:1rem;}
.btn-save{flex:1;padding:10px;border-radius:9px;border:none;background:linear-gradient(135deg,#1565c0,#1e88e5);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif;}
.btn-cancel{padding:10px 18px;border-radius:9px;border:1px solid #30363d;background:transparent;color:#8b949e;font-family:'Tajawal',sans-serif;font-size:14px;cursor:pointer;}
.modal-err{display:none;color:#f87171;font-size:12px;margin-top:6px;}
.logo-preview-box{width:90px;height:90px;border-radius:14px;border:1px solid #30363d;background:#080d16;display:flex;align-items:center;justify-content:center;margin:8px auto 0;overflow:hidden;}
.logo-preview-box img{width:100%;height:100%;object-fit:contain;}
.um-table{width:100%;border-collapse:collapse;margin-bottom:1rem;}
.um-table th{text-align:right;padding:6px 8px;color:#6e7681;font-weight:600;font-size:12px;border-bottom:1px solid #21262d;}
.um-table td{padding:8px;border-bottom:1px solid #21262d;color:#e6edf3;font-size:13px;}
.um-form-wrap{background:#0d1117;border:1px solid #30363d;border-radius:12px;padding:1rem;margin-top:.5rem;}
.pm-row{display:flex;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid #21262d;transition:background .15s;}
.pm-row:last-child{border-bottom:none;}
.pm-row:hover{background:rgba(255,255,255,0.02);}
.pm-logo-thumb{width:44px;height:44px;border-radius:10px;overflow:hidden;background:#080d16;border:1px solid rgba(33,150,243,0.2);flex-shrink:0;}
.pm-logo-thumb img{width:100%;height:100%;object-fit:contain;}
.pm-info{flex:1;min-width:0;}
.pm-name{color:#e6edf3;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pm-link{color:#6e7681;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right;}
.pm-actions{display:flex;gap:6px;flex-shrink:0;}
.pm-btn{padding:5px 11px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;font-family:Tajawal,sans-serif;border:none;}
.pm-btn-edit{background:#0d1f35;border:1px solid #1a6fa8 !important;color:#60a5fa;}
.pm-btn-del{background:#1f0d0d;border:1px solid #dc2626 !important;color:#f87171;}
.pm-badge-builtin{font-size:10px;color:#6e7681;background:#21262d;border-radius:4px;padding:2px 6px;margin-top:2px;display:inline-block;}

</style>
</head>

<div class="beam beam-main"></div>
<div class="beam beam-red"></div>
<div class="beam beam-right"></div>
<div class="hex-ring" style="width:750px;height:750px;animation-duration:6s;"></div>

<div id="particles"></div>

const COLORS = ['#2196F3','#1976d2','#e53935','#ffffff','#64b5f6','#ef9a9a'];
const pc = document.getElementById('particles');
function makeParticle(){
  const el = document.createElement('div');
  el.className = 'particle';
  const s=Math.random()*3+1, c=COLORS[Math.floor(Math.random()*COLORS.length)];
  const d=Math.random()*9+7, dl=Math.random()*5, dx=(Math.random()-.5)*80;
  el.style.cssText='width:'+s+'px;height:'+s+'px;bottom:0;left:'+(Math.random()*100)+'%;background:'+c+';opacity:0;--dx:'+dx+'px;animation-duration:'+d+'s;animation-delay:'+dl+'s;box-shadow:0 0 '+(s*3)+'px '+c+';';
  pc.appendChild(el);
  setTimeout(function(){ el.remove(); },(d+dl)*1000+500);
}
for(var i=0;i<40;i++) makeParticle();
setInterval(makeParticle,500);

//  FIREBASE
// ══════════════════════════════════════════
var DB_URL = 'https://cure10-default-rtdb.firebaseio.com';
async function fbGet(path){
  try{
    var r = await fetch(DB_URL+'/'+path+'.json',{method:'GET',mode:'cors'});
    return r.ok ? await r.json() : null;
  }catch(e){ return null; }
}
async function fbPut(path,data){
  try{
    await fetch(DB_URL+'/'+path+'.json',{
      method:'PUT',mode:'cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    });
  }catch(e){ showToast('❌ خطأ في الحفظ','#dc2626'); }
}

// ══════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════
function showToast(msg,color){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:999999;background:'+(color||'#1565c0')+';color:#fff;padding:10px 22px;border-radius:10px;font-family:Tajawal,sans-serif;font-size:14px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,0.4);white-space:nowrap;';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); },2800);
}

//  AUTH
// ══════════════════════════════════════════
var DEFAULT_ADMINS = {
  'elattar89': {pass:'Rio@2211',role:'admin'},
  'didi':      {pass:'Didi@2211',role:'admin'}
};

async function loadUsersFromFirebase(){
  var data = await fbGet('ab_users');
  if(!data || !data.admins){
    var init = {admins: DEFAULT_ADMINS, guests: {}};
    await fbPut('ab_users', init);
    return init;
  }
  return data;
}
async function saveUsersToFirebase(data){ await fbPut('ab_users', data); }

function togglePass(){
  var cb = document.getElementById('showPassCb');
  document.getElementById('password').type = cb.checked ? 'text' : 'password';
}

async function doLogin(){
  var btn   = document.getElementById('loginBtn');
  var u     = document.getElementById('username').value.trim().toLowerCase();
  var p     = document.getElementById('password').value.trim();
  var errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';

  if(!u || !p){
    errEl.textContent = 'يرجى إدخال اسم المستخدم وكلمة المرور';
    errEl.style.display = 'block';
    return;
  }

  btn.textContent = '⏳ جاري التحقق...';
  btn.style.opacity = '.7';
  btn.disabled = true;

  var data = await loadUsersFromFirebase();
  var matched = false;

  if(data && data.admins && data.admins[u] && data.admins[u].pass === p) matched = true;
  if(!matched && data && data.guests && data.guests[u] && data.guests[u].pass === p) matched = true;
  if(!matched && DEFAULT_ADMINS[u] && DEFAULT_ADMINS[u].pass === p) matched = true;

  btn.textContent = 'دخول ←';
  btn.style.opacity = '1';
  btn.disabled = false;

  if(matched){
    sessionStorage.setItem('ab_auth','1');
    showProjectsPage();
  } else {
    errEl.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
    errEl.style.display = 'block';
  }
}

function showProjectsPage(){
  document.getElementById('loginPage').style.display    = 'none';
  document.getElementById('projectsPage').style.display = 'flex';
  document.getElementById('pageFooter').style.display   = 'flex';
  renderProjects();
}

function showLoginPage(){
  document.getElementById('projectsPage').style.display = 'none';
  document.getElementById('pageFooter').style.display   = 'none';
  document.getElementById('loginPage').style.display    = 'flex';
  document.getElementById('username').value  = '';
  document.getElementById('password').value  = '';
  document.getElementById('loginErr').style.display = 'none';
}

function logout(){
  if(!confirm('هل تريد تسجيل الخروج؟')) return;
  sessionStorage.removeItem('ab_auth');
  showLoginPage();
}

document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('password').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  document.getElementById('username').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('password').focus(); });
  if(sessionStorage.getItem('ab_auth') === '1'){
    showProjectsPage();
  }
});

  var grid  = document.getElementById('projectsGrid');
  grid.innerHTML = '';
  BUILTIN.forEach(function(p){ grid.appendChild(makeCard(p, true)); });
  Object.keys(saved).forEach(function(id){
    var proj = saved[id];
    proj.id  = id;
    grid.appendChild(makeCard(proj, false));
  });
  var add = document.createElement('div');
  add.className = 'add-card';
  add.onclick   = openAddProject;
  add.innerHTML = '<div class="add-icon">+</div><div class="add-label">إضافة مشروع جديد</div>';
  grid.appendChild(add);
}

function makeCard(p, isBuiltin){
  var div = document.createElement('div');
  div.className = 'proj-card';
  div.onclick   = function(){ window.open(p.link, '_self'); };

  // no delete button on card — managed via إدارة المشاريع

  var inner = document.createElement('div');
  inner.innerHTML =
    '<div class="proj-card-glow"></div>'
   +'<div class="proj-corner pc-tl"></div><div class="proj-corner pc-br"></div>'
   +'<div class="proj-corner pc-tr"></div><div class="proj-corner pc-bl"></div>'
   +'<div class="proj-logo-wrap">'
   +  '<div class="proj-logo-ring" style="width:155px;height:155px;"></div>'
   +  '<div class="proj-logo-ring proj-logo-ring2" style="width:173px;height:173px;"></div>'
   +  '<div class="proj-logo-box"><img src="'+p.logo+'" alt="'+p.name+'"/></div>'
   +  '<div class="proj-bubble" style="width:5px;height:5px;left:15%;animation-duration:4s;"></div>'
   +  '<div class="proj-bubble" style="width:4px;height:4px;left:70%;animation-duration:5s;animation-delay:1s;"></div>'
   +'</div>'
   +'<div class="proj-name">'+p.name+'</div>'
   +'<div class="proj-desc">'+(p.desc||'')+'</div>'
   +'<div class="proj-btn">فتح المشروع &#8592;</div>';

  div.appendChild(inner);
  return div;
}

async function deleteProject(id){
  if(!confirm('حذف هذا المشروع؟')) return;
  var saved = await loadProjects();
  delete saved[id];
  await fbPut('ab_projects', saved);
  showToast('🗑️ تم الحذف', '#dc2626');
  renderProjects();
}

function openAddProject(){
  _logoData = null;
  document.getElementById('projName').value     = '';
  document.getElementById('projDesc').value     = '';
  document.getElementById('projLink').value     = '';
  document.getElementById('projLogoFile').value = '';
  document.getElementById('logoPreviewBox').style.display = 'none';
  document.getElementById('projErr').style.display        = 'none';
  document.getElementById('projModal').style.display      = 'flex';
}
function closeProjModal(){ document.getElementById('projModal').style.display = 'none'; }

function previewLogo(input){
  if(!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e){
    _logoData = e.target.result;
    document.getElementById('logoPreviewImg').src               = _logoData;
    document.getElementById('logoPreviewBox').style.display     = 'block';
  };
  reader.readAsDataURL(input.files[0]);
}

async function saveProject(){
  var name = document.getElementById('projName').value.trim();
  var desc = document.getElementById('projDesc').value.trim();
  var link = document.getElementById('projLink').value.trim();
  var err  = document.getElementById('projErr');
  if(!name){ err.textContent='يرجى إدخال اسم المشروع'; err.style.display='block'; return; }
  if(!link){ err.textContent='يرجى إدخال رابط المشروع'; err.style.display='block'; return; }
  if(!_logoData){ err.textContent='يرجى رفع لوجو المشروع'; err.style.display='block'; return; }
  err.style.display = 'none';
  var saved = await loadProjects();
  var id    = 'proj_' + Date.now();
  saved[id] = {name:name, desc:desc, link:link, logo:_logoData};
  await fbPut('ab_projects', saved);
  showToast('✅ تم حفظ المشروع: '+name, '#16a34a');
  closeProjModal();
  renderProjects();
}

async function renderUsersManager(){
  var content = document.getElementById('usersManagerContent');
  content.innerHTML = '<div style="color:#8b949e;padding:1rem;text-align:center;">⏳ جاري التحميل...</div>';
  var data = await loadUsersFromFirebase();
  if(!data.admins) data.admins = {};
  if(!data.guests) data.guests = {};

  var html = '';

  // Admins section
  html += '<div style="margin-bottom:1.5rem;">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;">';
  html += '<div style="color:#a78bfa;font-size:14px;font-weight:700;">🔑 حسابات الأدمن</div>';
  html += '<button onclick="showAddAdminForm()" style="padding:6px 14px;border-radius:8px;border:1px solid #7c3aed;background:#3b0764;color:#c4b5fd;font-size:12px;cursor:pointer;font-family:Tajawal,sans-serif;font-weight:700;">+ إضافة أدمن</button>';
  html += '</div>';
  var admins = Object.keys(data.admins);
  if(!admins.length){
    html += '<div style="color:#6e7681;font-size:12px;padding:12px;text-align:center;">لا يوجد أدمن</div>';
  } else {
    html += '<table class="um-table"><tr><th>اسم المستخدم</th><th>كلمة المرور</th><th style="text-align:center;">إجراءات</th></tr>';
    admins.forEach(function(u){
      var pw = data.admins[u].pass || '';
      html += '<tr><td style="font-weight:700;">'+u+'</td><td style="direction:ltr;color:#8b949e;">'+pw+'</td>';
      html += '<td><div style="display:flex;gap:5px;justify-content:center;">';
      html += '<button onclick="showEditPassForm(\'admin\',\''+u+'\')" style="padding:4px 10px;border-radius:6px;border:1px solid #1a6fa8;background:#0d1f35;color:#60a5fa;font-size:11px;cursor:pointer;font-family:Tajawal,sans-serif;">✏️ تعديل</button>';
      html += '<button onclick="deleteUser(\'admin\',\''+u+'\')" style="padding:4px 10px;border-radius:6px;border:1px solid #dc2626;background:#1f0d0d;color:#f87171;font-size:11px;cursor:pointer;font-family:Tajawal,sans-serif;">🗑️ حذف</button>';
      html += '</div></td></tr>';
    });
    html += '</table>';
  }
  html += '</div>';

  // Guests section
  html += '<div>';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;">';
  html += '<div style="color:#34d399;font-size:14px;font-weight:700;">👤 حسابات Guest</div>';
  html += '<button onclick="showAddGuestForm()" style="padding:6px 14px;border-radius:8px;border:1px solid #059669;background:#064e3b;color:#6ee7b7;font-size:12px;cursor:pointer;font-family:Tajawal,sans-serif;font-weight:700;">+ إضافة Guest</button>';
  html += '</div>';
  var guests = Object.keys(data.guests);
  if(!guests.length){
    html += '<div style="color:#6e7681;font-size:12px;padding:12px;text-align:center;">لا يوجد حسابات Guest</div>';
  } else {
    html += '<table class="um-table"><tr><th>اسم المستخدم</th><th>الباسورد</th><th style="text-align:center;">إجراءات</th></tr>';
    guests.forEach(function(u){
      var g = data.guests[u];
      html += '<tr><td style="font-weight:700;">'+u+'</td><td style="direction:ltr;color:#8b949e;">'+(g.pass||'')+'</td>';
      html += '<td><div style="display:flex;gap:5px;justify-content:center;">';
      html += '<button onclick="showEditPassForm(\'guest\',\''+u+'\')" style="padding:4px 10px;border-radius:6px;border:1px solid #1a6fa8;background:#0d1f35;color:#60a5fa;font-size:11px;cursor:pointer;font-family:Tajawal,sans-serif;">✏️ تعديل</button>';
      html += '<button onclick="deleteUser(\'guest\',\''+u+'\')" style="padding:4px 10px;border-radius:6px;border:1px solid #dc2626;background:#1f0d0d;color:#f87171;font-size:11px;cursor:pointer;font-family:Tajawal,sans-serif;">🗑️ حذف</button>';
      html += '</div></td></tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  html += '<div id="usersFormArea" style="margin-top:1rem;"></div>';
  content.innerHTML = html;
}

async function saveNewAdmin(){
  var u = (document.getElementById('newAdminUser').value||'').trim().toLowerCase();
  var p = (document.getElementById('newAdminPass').value||'').trim();
  var err = document.getElementById('usersFormErr');
  if(!u||!p){ err.textContent='يرجى إدخال اسم المستخدم وكلمة المرور'; err.style.display='block'; return; }
  var data = await loadUsersFromFirebase() || {admins:{},guests:{}};
  if(data.admins && data.admins[u]){ err.textContent='اسم المستخدم موجود'; err.style.display='block'; return; }
  if(!data.admins) data.admins = {};
  data.admins[u] = {pass:p, role:'admin'};
  await saveUsersToFirebase(data);
  showToast('✅ تم إضافة الأدمن: '+u, '#16a34a');
  await renderUsersManager();
}

async function saveNewGuest(){
  var u = (document.getElementById('newGuestUser').value||'').trim().toLowerCase();
  var p = (document.getElementById('newGuestPass').value||'').trim();
  var err = document.getElementById('usersFormErr');
  if(!u||!p){ err.textContent='يرجى إدخال اسم المستخدم وكلمة المرور'; err.style.display='block'; return; }
  var data = await loadUsersFromFirebase() || {admins:{},guests:{}};
  if(data.admins && data.admins[u]){ err.textContent='الاسم مستخدم كأدمن'; err.style.display='block'; return; }
  if(data.guests && data.guests[u]){ err.textContent='اسم المستخدم موجود'; err.style.display='block'; return; }
  if(!data.guests) data.guests = {};
  data.guests[u] = {pass:p};
  await saveUsersToFirebase(data);
  showToast('✅ تم إضافة Guest: '+u, '#16a34a');
  await renderUsersManager();
}

async function saveEditPass(type, username){
  var p = (document.getElementById('editPassInput').value||'').trim();
  if(!p){ showToast('❌ أدخل كلمة المرور الجديدة','#dc2626'); return; }
  var data = await loadUsersFromFirebase() || {admins:{},guests:{}};
  if(type==='admin' && data.admins && data.admins[username]) data.admins[username].pass = p;
  if(type==='guest' && data.guests && data.guests[username]) data.guests[username].pass = p;
  await saveUsersToFirebase(data);
  showToast('✅ تم تعديل الباسورد', '#16a34a');
  await renderUsersManager();
}

async function deleteUser(type, username){
  if(!confirm('حذف الحساب: '+username+'؟')) return;
  var data = await loadUsersFromFirebase() || {admins:{},guests:{}};
  if(type==='admin' && data.admins) delete data.admins[username];
  if(type==='guest' && data.guests) delete data.guests[username];
  await saveUsersToFirebase(data);
  showToast('🗑️ تم حذف: '+username, '#dc2626');
  await renderUsersManager();
}

  document.getElementById('projManagerModal').style.display = 'flex';
  document.getElementById('projManagerFormArea').innerHTML  = '';
  renderProjectsManager();
}
function closeProjManager(){
  document.getElementById('projManagerModal').style.display = 'none';
}

async function renderProjectsManager(){
  var content = document.getElementById('projManagerContent');
  content.innerHTML = '<div style="color:#8b949e;padding:1rem;text-align:center;">&#9203; جاري التحميل...</div>';
  var saved = await loadProjects();
  var keys  = Object.keys(saved);
  var html  = '';

  // Built-in first (read-only display)
  html += '<div style="margin-bottom:.5rem;">';
  html += '<div style="color:#6e7681;font-size:11px;letter-spacing:1px;margin-bottom:.5rem;">&#9679; المشاريع الثابتة</div>';
  BUILTIN.forEach(function(p){
    html += '<div class="pm-row">';
    html += '<div class="pm-logo-thumb"><img src="'+p.logo+'" alt="'+p.name+'"/></div>';
    html += '<div class="pm-info"><div class="pm-name">'+p.name+'</div>';
    html += '<div class="pm-link">'+p.link+'</div></div>';
    html += '<span class="pm-badge-builtin">ثابت</span>';
    html += '</div>';
  });
  html += '</div>';

  if(keys.length > 0){
    html += '<div style="color:#6e7681;font-size:11px;letter-spacing:1px;margin-bottom:.5rem;margin-top:.8rem;">&#9679; المشاريع المضافة</div>';
    html += '<div>';
    keys.forEach(function(id){
      var p = saved[id];
      html += '<div class="pm-row" id="pmrow_'+id+'">';
      html += '<div class="pm-logo-thumb"><img src="'+p.logo+'" alt="'+p.name+'"/></div>';
      html += '<div class="pm-info"><div class="pm-name">'+p.name+'</div>';
      html += '<div class="pm-link">'+(p.link||'')+'</div></div>';
      html += '<div class="pm-actions">';
      html += '<button class="pm-btn pm-btn-edit" onclick="showEditProjectForm(\'' + id + '\')">&#9998; تعديل</button>';
      html += '<button class="pm-btn pm-btn-del" onclick="deleteProjectFromManager(\'' + id + '\')">&#128465; حذف</button>';
      html += '</div></div>';
    });
    html += '</div>';
  } else {
    html += '<div style="color:#6e7681;font-size:12px;padding:12px;text-align:center;margin-top:.5rem;">لا توجد مشاريع مضافة بعد</div>';
  }

  content.innerHTML = html;
}

async function deleteProjectFromManager(id){
  if(!confirm('حذف هذا المشروع؟')) return;
  var saved = await loadProjects();
  delete saved[id];
  await fbPut('ab_projects', saved);
  showToast('&#128465;&#65039; تم الحذف', '#dc2626');
  renderProjectsManager();
  renderProjects();
}

function openAddFromManager(){
  document.getElementById('projManagerFormArea').innerHTML = buildProjectForm(null, null);
}

async function showEditProjectForm(id){
  var saved = await loadProjects();
  var p = saved[id];
  if(!p) return;
  document.getElementById('projManagerFormArea').innerHTML = buildProjectForm(id, p);
}

function buildProjectForm(id, p){
  var isEdit   = (id !== null);
  var name     = isEdit ? p.name  : '';
  var desc     = isEdit ? (p.desc||'') : '';
  var link     = isEdit ? p.link  : '';
  var title    = isEdit ? '&#9998; تعديل المشروع' : '&#10133; إضافة مشروع جديد';
  var saveCall = isEdit ? 'saveEditedProject(\'' + id + '\')' : 'saveNewProjectFromManager()';
  var logoNote = isEdit ? '<div style="color:#6e7681;font-size:11px;margin-top:4px;">اتركه فاضي للإبقاء على اللوجو الحالي</div>' : '';

  return '<div class="um-form-wrap">'
    +'<div style="color:#93c5fd;font-weight:700;margin-bottom:.8rem;">'+title+'</div>'
    +'<div class="modal-field"><label>اسم المشروع</label>'
    +'<input id="pmProjName" class="modal-input" placeholder="CURE MEDICAL" value="'+name+'"/></div>'
    +'<div class="modal-field"><label>وصف قصير (اختياري)</label>'
    +'<input id="pmProjDesc" class="modal-input" placeholder="وصف المشروع" value="'+desc+'"/></div>'
    +'<div class="modal-field"><label>رابط المشروع</label>'
    +'<input id="pmProjLink" class="modal-input" placeholder="https://..." value="'+link+'"/></div>'
    +'<div class="modal-field"><label>لوجو المشروع (صورة)</label>'
    +'<input type="file" id="pmProjLogoFile" accept="image/*" onchange="pmPreviewLogo(this)" style="width:100%;padding:8px;border-radius:9px;border:1px solid #30363d;background:#161b22;color:#8b949e;font-family:Tajawal,sans-serif;font-size:13px;cursor:pointer;"/>'
    +logoNote
    +'<div id="pmLogoPreviewBox" style="display:none;" class="logo-preview-box"><img id="pmLogoPreviewImg" src="" alt="preview"/></div>'
    +'</div>'
    +'<div class="modal-err" id="pmProjErr"></div>'
    +'<div style="display:flex;gap:8px;margin-top:.8rem;">'
    +'<button onclick="'+saveCall+'" style="flex:1;padding:10px;border-radius:9px;border:none;background:linear-gradient(135deg,#1565c0,#1e88e5);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:Tajawal,sans-serif;">&#128190; حفظ</button>'
    +'<button onclick="clearPmForm()" style="padding:10px 18px;border-radius:9px;border:1px solid #30363d;background:transparent;color:#8b949e;font-family:Tajawal,sans-serif;font-size:14px;cursor:pointer;">إلغاء</button>'
    +'</div></div>';
}

var _pmLogoData = null;
function pmPreviewLogo(input){
  if(!input.files||!input.files[0]) return;
  var r = new FileReader();
  r.onload = function(e){
    _pmLogoData = e.target.result;
    document.getElementById('pmLogoPreviewImg').src = _pmLogoData;
    document.getElementById('pmLogoPreviewBox').style.display = 'block';
  };
  r.readAsDataURL(input.files[0]);
}

function clearPmForm(){
  _pmLogoData = null;
  document.getElementById('projManagerFormArea').innerHTML = '';
}

async function saveNewProjectFromManager(){
  var name = (document.getElementById('pmProjName').value||'').trim();
  var desc = (document.getElementById('pmProjDesc').value||'').trim();
  var link = (document.getElementById('pmProjLink').value||'').trim();
  var err  = document.getElementById('pmProjErr');
  if(!name){ err.textContent='يرجى إدخال اسم المشروع'; err.style.display='block'; return; }
  if(!link){ err.textContent='يرجى إدخال رابط المشروع'; err.style.display='block'; return; }
  if(!_pmLogoData){ err.textContent='يرجى رفع لوجو المشروع'; err.style.display='block'; return; }
  err.style.display = 'none';
  var saved = await loadProjects();
  var id    = 'proj_'+Date.now();
  saved[id] = {name:name, desc:desc, link:link, logo:_pmLogoData};
  await fbPut('ab_projects', saved);
  _pmLogoData = null;
  showToast('&#10003; تم حفظ المشروع: '+name, '#16a34a');
  clearPmForm();
  renderProjectsManager();
  renderProjects();
}

async function saveEditedProject(id){
  var name = (document.getElementById('pmProjName').value||'').trim();
  var desc = (document.getElementById('pmProjDesc').value||'').trim();
  var link = (document.getElementById('pmProjLink').value||'').trim();
  var err  = document.getElementById('pmProjErr');
  if(!name){ err.textContent='يرجى إدخال اسم المشروع'; err.style.display='block'; return; }
  if(!link){ err.textContent='يرجى إدخال رابط المشروع'; err.style.display='block'; return; }
  err.style.display = 'none';
  var saved = await loadProjects();
  if(!saved[id]) return;
  saved[id].name = name;
  saved[id].desc = desc;
  saved[id].link = link;
  if(_pmLogoData) saved[id].logo = _pmLogoData;
  await fbPut('ab_projects', saved);
  _pmLogoData = null;
  showToast('&#10003; تم التعديل: '+name, '#16a34a');
  clearPmForm();
  renderProjectsManager();
  renderProjects();
}

window.openProjectsManager       = openProjectsManager;
window.closeProjManager          = closeProjManager;
